<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Addis Active | Discover, Move & Connect in Addis Ababa</title>
  
  <!-- PWA Manifest & Theme -->
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#080808">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Addis Active">

  <!-- Google Fonts: Inter & Syne for High-Endurance Dark Identity -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Leaflet CSS for OpenStreetMap integration -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

  <!-- Custom Application Styles -->
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- Offline / Online Status Banner -->
  <div id="offlineBanner" class="offline-banner" style="display:none;">
    <span>⚡ Offline Mode Active — Local routes and tracking work normally. Cloud sync unavailable.</span>
  </div>

  <!-- App Header / Top Nav -->
  <header class="app-header">
    <div class="header-inner">
      <div class="brand-box" data-link="home" style="cursor:pointer;">
        <span class="brand-logo">⚡</span>
        <div>
          <h1 class="brand-name">ADDIS ACTIVE</h1>
          <span class="brand-badge">BETA v1.0</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="searchTrigger" class="icon-btn" aria-label="Search">🔍</button>
        <button class="icon-btn" data-link="profile" aria-label="Profile">👤</button>
      </div>
    </div>
  </header>

  <!-- Main Viewport Shell -->
  <main id="appMain" class="app-main">
    <!-- Dynamic Views Render Here -->
  </main>

  <!-- Global Search Modal -->
  <div id="searchModal" class="search-modal">
    <div class="search-modal-content">
      <div class="search-bar-header">
        <input type="text" id="globalSearchInput" placeholder="Search routes, events, communities..." autocomplete="off">
        <button id="searchClose" class="btn-close">✕</button>
      </div>
      <div id="searchResults" class="search-results-list">
        <p class="search-hint">Type anything to explore Addis Ababa...</p>
      </div>
    </div>
  </div>

  <!-- Mobile Bottom Navigation Bar -->
  <nav class="mobile-nav" aria-label="Bottom Navigation">
    <button class="nav-tab active" data-target="home">
      <span class="nav-icon">🏠</span>
      <span class="nav-text">Home</span>
    </button>
    <button class="nav-tab" data-target="explore">
      <span class="nav-icon">🗺️</span>
      <span class="nav-text">Explore</span>
    </button>
    <button class="nav-tab" data-target="activity">
      <span class="nav-icon">⚡</span>
      <span class="nav-text">Track</span>
    </button>
    <button class="nav-tab" data-target="events">
      <span class="nav-icon">📅</span>
      <span class="nav-text">Events</span>
    </button>
    <button class="nav-tab" data-target="profile">
      <span class="nav-icon">👤</span>
      <span class="nav-text">Journey</span>
    </button>
  </nav>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  
  <!-- Main Application Script -->
  <script type="module" src="./app.js"></script>
</body>
</html>
